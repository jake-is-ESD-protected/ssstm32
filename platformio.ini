; PlatformIO Project Configuration File
; State Space Model Driver for STM32 Platform
; Target: STM32 Nucleo H7 board

[env:nucleo_h753zi]
platform = ststm32
board = nucleo_h753zi
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

; Include jescore library
lib_deps =
    jescore

; Build flags for STM32H7
build_flags =
    -mfloat-abi=hard
    -mfpu=fpv4-sp-d16

; For release builds
[env:nucleo_h753zi-release]
extends = env:nucleo_h753zi
build_type = release

; For debug builds
[env:nucleo_h753zi-debug]
extends = env:nucleo_h753zi
build_type = debug
debug_speed = 40000
debug_init_break = tbreak main
debug_build_flags = -O0 -g -ggdb
